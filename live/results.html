  *{box-sizing:border-box;margin:0;padding:0;}

       min-height:100vh;padding:3vh 3.2vw;display:grid;grid-template-rows:auto 1fr;gap:2.6vh;}
  .top{display:flex;align-items:center;gap:2vw;}
  .top h1{font-size:clamp(24px,3.2vw,46px);letter-spacing:-.8px;line-height:1.05;flex:1;}
  .top h1 span{color:var(--purple);}
  .qr{background:#fff;border-radius:12px;padding:8px 8px 5px;text-align:center;flex:none;}
  .qr svg{width:clamp(90px,9vw,150px);height:clamp(90px,9vw,150px);display:block;}
  .qr div{font-size:11px;color:#333;margin-top:3px;}
  .grid{display:grid;grid-template-columns:1fr 1.25fr;gap:2.4vw;min-height:0;}
  .col{display:grid;gap:2.2vh;align-content:start;}
  .lbl{font-size:clamp(11px,.95vw,14px);letter-spacing:3px;text-transform:uppercase;color:var(--purple-lt);font-weight:600;margin-bottom:1vh;display:flex;gap:10px;align-items:center;}
  .lbl::before{content:"";width:24px;height:3px;background:var(--purple);border-radius:2px;}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;}
  .role{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:1.6vh 1vw;}
  .role b{display:block;font-size:clamp(30px,4.2vw,64px);line-height:1;color:var(--purple);font-variant-numeric:tabular-nums;}
  .role:nth-child(2) b{color:var(--green);} .role:nth-child(3) b{color:#fff;}
  .role span{font-size:clamp(11px,1vw,15px);color:#ddd;}
  .bar{display:grid;grid-template-columns:clamp(150px,15vw,250px) 1fr 3ch;gap:12px;align-items:center;margin:.9vh 0;font-size:clamp(12px,1.05vw,16px);color:#e8e6ee;}
  .bar i{display:block;height:clamp(12px,1.5vh,18px);border-radius:6px;background:var(--purple);min-width:4px;transition:width .6s;}
  .bar.g i{background:var(--green);} .bar.r i{background:var(--coral);}
  .bar b{text-align:right;font-variant-numeric:tabular-nums;}
  .wall{columns:2;column-gap:1.2vw;}
  .quote{break-inside:avoid;background:#fff;color:#222;border-radius:12px;padding:1.4vh 1vw;margin-bottom:1.2vw;font-size:clamp(13px,1.15vw,19px);line-height:1.35;border-left:5px solid var(--purple);}
  .quote.leader{border-left-color:#00865A;} .quote.investor{border-left-color:#222;}
  .quote small{display:block;margin-top:.6vh;font-size:clamp(10px,.8vw,12px);letter-spacing:1.2px;text-transform:uppercase;color:#777;}
  .empty{color:var(--muted);font-size:clamp(14px,1.2vw,18px);}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} .wall{columns:1;} .top{flex-wrap:wrap;} }
  .off{position:fixed;bottom:10px;right:14px;font-size:12px;color:var(--coral);display:none;}

<script>
(function(){
  var API = (new URLSearchParams(location.search).get('api')) || 'https://smartai.threshlds.co/api/launchcamp';
  var ROLE = {founder:'Founder', leader:'Leader', investor:'Investor'};
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function bars(rows, max){
    return rows.map(function(r){ return '<div class="bar '+(r[2]||'')+'"><span>'+r[0]+'</span><i style="width:'+(max ? r[1]/max*100 : 0)+'%"></i><b>'+r[1]+'</b></div>'; }).join('');
  }
  function draw(d){
    document.getElementById('n').textContent = d.n;
    ['founder','leader','investor'].forEach(function(k){ document.getElementById('r-'+k).textContent = d.ruolo[k]; });
    var a = d.agenti, built = a.test + a.prod + a.measured, prod = a.prod + a.measured;
    document.getElementById('agents').innerHTML = bars([
      ['None yet', a.none, ''], ['Built one', built, ''], ['One in production', prod, 'g'], ["Know how often it's wrong", a.measured, 'r']], d.n);
    var t = d.track;
    document.getElementById('tracks').innerHTML = bars([['Lovable', t.lovable, ''], ['Coding agent', t.code, 'g'], ['Not sure yet', t.unsure, '']], d.n);
    if(d.piatti.length){
      document.getElementById('wall').innerHTML = d.piatti.slice(0, 16).map(function(p){
        return '<div class="quote '+p.ruolo+'">'+esc(p.piatto)+'<small>'+ROLE[p.ruolo]+'</small></div>'; }).join('');
    }
  }
  function tick(){
    fetch(API + '/results', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ document.getElementById('off').style.display = 'none'; draw(d); })
      .catch(function(){ document.getElementById('off').style.display = 'block'; });
  }
  tick(); setInterval(tick, 3000);
})();
</script>
